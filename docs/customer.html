<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - AI Aim Assist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .header { background: #16213e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e94560; }
        .header h1 { color: #e94560; font-size: 20px; }
        .header .user-info { display: flex; align-items: center; gap: 15px; }
        .header .user-info span { color: #888; font-size: 14px; }
        .header button { background: #e94560; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .header button:hover { background: #c73e54; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: #16213e; border-radius: 10px; padding: 30px; margin-bottom: 20px; }
        .card h2 { color: #e94560; margin-bottom: 20px; font-size: 18px; }
        .card p { color: #aaa; font-size: 14px; line-height: 1.6; }
        .card .label { color: #888; font-size: 12px; display: block; margin-bottom: 5px; }
        .card .value { color: #fff; font-size: 16px; margin-bottom: 15px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 3px; font-size: 12px; background: #0f3460; color: #e94560; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #c73e54; }
        .btn-secondary { background: #0f3460; color: #fff; }
        .btn-secondary:hover { background: #1a4a80; }
        .text-center { text-align: center; }
        .mt-20 { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Aim Assist</h1>
        <div class="user-info">
            <span id="displayUsername">User</span>
            <button onclick="logout()">Sign Out</button>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Account Overview</h2>
            <div class="info-grid">
                <div>
                    <span class="label">Username</span>
                    <div class="value" id="profileUsername">-</div>
                </div>
                <div>
                    <span class="label">Email</span>
                    <div class="value" id="profileEmail">-</div>
                </div>
                <div>
                    <span class="label">Status</span>
                    <div class="value"><span class="badge">Active</span></div>
                </div>
                <div>
                    <span class="label">Member Since</span>
                    <div class="value" id="profileJoined">-</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>License Keys</h2>
            <p>Enter your license key in the application to activate it.</p>
            <div id="keysContainer" style="margin-top:20px;">
                <p style="color:#888;font-size:13px;">Loading your keys...</p>
            </div>
            <div class="mt-20 text-center">
                <a href="https://discord.gg/N4bGGrfVA" target="_blank" style="color:#e94560;text-decoration:none;font-size:13px;">Need help? Contact support</a>
            </div>
        </div>

        <div class="card">
            <h2>Downloads</h2>
            <p>Download the latest version of AI Aim Assist.</p>
            <div class="mt-20">
                <button class="btn btn-primary" onclick="window.open('https://github.com/x2gts/ai-aimassist-source/releases/download/v1.0.0/example_win32_directx11.exe', '_blank')">Download Latest Version</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://ai-aimassist-source.onrender.com';
        const userData = JSON.parse(localStorage.getItem('customer_user'));

        if (!userData) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('displayUsername').textContent = userData.username;
            document.getElementById('profileUsername').textContent = userData.username;
            document.getElementById('profileEmail').textContent = userData.email || 'Not provided';
            document.getElementById('profileJoined').textContent = new Date().toLocaleDateString();
            loadKeys();
        }

        async function loadKeys() {
            const container = document.getElementById('keysContainer');
            try {
                const res = await fetch(API_URL + '/?action=user_keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userData.username })
                });
                const data = await res.json();

                if (data.success && data.keys.length > 0) {
                    let html = '';
                    data.keys.forEach(key => {
                        const statusColor = key.is_banned ? '#e74c3c' : (key.is_active ? '#2ecc71' : '#f39c12');
                        const statusText = key.is_banned ? 'Banned' : (key.is_active ? 'Active' : 'Inactive');
                        const expiryText = key.expires_at ? 'Expires: ' + key.expires_at : 'Lifetime';
                        
                        html += '<div style="background:#0f3460;padding:15px;border-radius:5px;margin-bottom:10px;">';
                        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
                        html += '<code style="color:#fff;font-size:16px;letter-spacing:1px;" id="key-' + key.license_key + '">' + key.license_key + '</code>';
                        html += '<button onclick="copyKey(\'' + key.license_key + '\')" style="background:#e94560;color:#fff;border:none;padding:6px 12px;border-radius:3px;cursor:pointer;font-size:12px;">Copy</button>';
                        html += '</div>';
                        html += '<div style="display:flex;gap:15px;font-size:12px;">';
                        html += '<span style="color:' + statusColor + ';">' + statusText + '</span>';
                        html += '<span style="color:#888;">' + key.subscription_type + '</span>';
                        html += '<span style="color:#888;">' + expiryText + '</span>';
                        html += '</div>';
                        html += '</div>';
                    });
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="color:#888;font-size:13px;">No license keys found. Contact support.</p>';
                }
            } catch (err) {
                container.innerHTML = '<p style="color:#e74c3c;font-size:13px;">Failed to load keys.</p>';
            }
        }

        function copyKey(key) {
            navigator.clipboard.writeText(key).then(() => {
                const el = document.getElementById('key-' + key);
                const btn = el.parentElement.querySelector('button');
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy', 1500);
            });
        }

        function logout() {
            localStorage.removeItem('customer_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
