<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Aim Assist</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%; padding: 20px; }
        .login-box { background: #16213e; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 380px; }
        .login-box h1 { text-align: center; margin-bottom: 5px; color: #e94560; font-size: 24px; }
        .login-box p.subtitle { text-align: center; margin-bottom: 30px; color: #888; font-size: 14px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: none; border-radius: 5px; background: #0f3460; color: #fff; font-size: 14px; outline: none; }
        .login-box input:focus { outline: 2px solid #e94560; }
        .login-box button { width: 100%; padding: 12px; border: none; border-radius: 5px; background: #e94560; color: #fff; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .login-box button:hover { background: #c73e54; }
        .login-box .link { text-align: center; margin-top: 20px; font-size: 13px; color: #888; }
        .login-box .link a { color: #e94560; text-decoration: none; }
        .login-box .link a:hover { text-decoration: underline; }
        .error { color: #e74c3c; margin-top: 10px; font-size: 13px; text-align: center; }
        .success { color: #2ecc71; margin-top: 10px; font-size: 13px; text-align: center; }
        .info { color: #f39c12; margin-top: 10px; font-size: 13px; text-align: center; }
        .hidden { display: none; }
        .register-form { margin-top: 20px; border-top: 1px solid #0f3460; padding-top: 20px; }
        .register-form h3 { text-align: center; color: #e94560; margin-bottom: 15px; font-size: 16px; }
        .btn-secondary { background: #0f3460 !important; }
        .btn-secondary:hover { background: #1a4a80 !important; }
        .btn-cancel { background: transparent !important; border: 1px solid #555 !important; color: #aaa !important; margin-top: 10px; }
        .btn-cancel:hover { background: #333 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box" id="loginBox">
            <h1>AI Aim Assist</h1>
            <p class="subtitle">Sign in to your account</p>

            <div id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <button onclick="handleLogin()">Sign In</button>
                <div id="loginMessage" class="error"></div>
                <div class="link">Don't have an account? <a href="#" onclick="showRegister()">Create one</a></div>
            </div>

            <div id="registerForm" class="hidden register-form">
                <h3>Create Account</h3>
                <input type="text" id="regUsername" placeholder="Username" autocomplete="off">
                <input type="email" id="regEmail" placeholder="Email (optional)" autocomplete="off">
                <input type="password" id="regPassword" placeholder="Password" autocomplete="new-password">
                <input type="password" id="regConfirm" placeholder="Confirm password" autocomplete="new-password">
                <button onclick="handleRegister()">Create Account</button>
                <button class="btn-cancel" onclick="showLogin()">Back to Sign In</button>
                <div id="registerMessage" class="error"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://ai-aimassist-source.onrender.com';

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginMessage').textContent = '';
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerMessage').textContent = '';
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const msgEl = document.getElementById('loginMessage');

            if (!username || !password) {
                msgEl.className = 'error';
                msgEl.textContent = 'Please enter username and password';
                return;
            }

            try {
                const res = await fetch(API_URL + '/?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    if (data.role === 'admin') {
                        localStorage.setItem('keyvex_admin_key', data.api_key);
                        window.location.href = 'admin/index.html';
                    } else {
                        localStorage.setItem('customer_user', JSON.stringify({
                            username: data.username,
                            email: data.email || ''
                        }));
                        window.location.href = 'customer.html';
                    }
                } else {
                    if (data.exists === false) {
                        msgEl.className = 'info';
                        msgEl.textContent = 'User not found. Would you like to ';
                        msgEl.innerHTML += '<a href="#" onclick="showRegister()" style="color:#e94560;">create an account</a>?';
                    } else {
                        msgEl.className = 'error';
                        msgEl.textContent = data.message || 'Login failed';
                    }
                }
            } catch (err) {
                msgEl.className = 'error';
                msgEl.textContent = 'Connection failed. Please try again.';
            }
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const msgEl = document.getElementById('registerMessage');

            if (!username || !password) {
                msgEl.className = 'error';
                msgEl.textContent = 'Username and password are required';
                return;
            }

            if (password !== confirm) {
                msgEl.className = 'error';
                msgEl.textContent = 'Passwords do not match';
                return;
            }

            if (username.length < 3) {
                msgEl.className = 'error';
                msgEl.textContent = 'Username must be at least 3 characters';
                return;
            }

            if (password.length < 4) {
                msgEl.className = 'error';
                msgEl.textContent = 'Password must be at least 4 characters';
                return;
            }

            try {
                const res = await fetch(API_URL + '/?action=register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email })
                });
                const data = await res.json();

                if (data.success) {
                    msgEl.className = 'success';
                    msgEl.textContent = 'Account created! You can now sign in.';
                    document.getElementById('regUsername').value = '';
                    document.getElementById('regEmail').value = '';
                    document.getElementById('regPassword').value = '';
                    document.getElementById('regConfirm').value = '';
                    setTimeout(() => showLogin(), 1500);
                } else {
                    msgEl.className = 'error';
                    msgEl.textContent = data.message || 'Registration failed';
                }
            } catch (err) {
                msgEl.className = 'error';
                msgEl.textContent = 'Connection failed. Please try again.';
            }
        }

        document.getElementById('loginPassword').addEventListener('keypress', e => {
            if (e.key === 'Enter') handleLogin();
        });
        document.getElementById('regConfirm').addEventListener('keypress', e => {
            if (e.key === 'Enter') handleRegister();
        });
    </script>
</body>
</html>
